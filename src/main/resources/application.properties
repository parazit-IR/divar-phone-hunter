# ============================================================
#  Divar Phone Hunter — all settings live here
#  (Spring reads .properties as ISO-8859-1, so keep this file
#   English/ASCII; the app translates "iphone"/"samsung" to
#   Persian before searching Divar.)
# ============================================================

spring.application.name=divar-phone-hunter
server.port=8080

# ---------- City ----------
# Divar city IDs: 1 = Tehran, 2 = Karaj, 3 = Mashhad, 4 = Isfahan, 5 = Tabriz, 6 = Shiraz
# (check the ID in the browser: DevTools > Network > "search" request > city_ids)
hunter.city.id=1
hunter.city.name=Tehran

# ---------- What to hunt ----------
hunter.category=mobile-phones
hunter.queries=iphone 13,iphone 14,iphone 15,\
  samsung S21,samsung S22,samsung S23,samsung S24,samsung S25,\
  samsung A05,samsung A06,samsung A15,samsung A16,samsung A25,samsung A26,\
  samsung A35,samsung A36,samsung A55,samsung A56
# Ads whose detected model does not match one of these regexes are ignored
hunter.allowed-models=iPhone 1[3-5]( Mini| Plus| Pro| Pro Max)?,\
  Galaxy S2[1-5]( Plus| Ultra| FE)?,\
  Galaxy A[0-9]{2}s?

# ---------- Agent loop ----------
# run every 5 minutes (milliseconds)
hunter.poll.interval-ms=60000
hunter.poll.initial-delay-ms=5000
# newest pages per query on every run (~24 ads per page)
hunter.poll.pages-per-query=4
# first run on an empty database: collect more history for medians
hunter.poll.bootstrap-pages=16
# pause between Divar requests — be polite, avoid getting blocked
hunter.poll.request-delay-ms=1500

# ---------- Price statistics ----------
# median / P75 are computed from ads seen in the last N days
hunter.stats.window-days=10

# ---------- Deal rules ----------
# at least 12% under the median ...
hunter.deal.min-discount-percent=5
# ... but more than 40% under is usually fake / bait -> ignored
hunter.deal.max-discount-percent=40
# do not trust a median built from fewer ads than this
hunter.deal.min-samples=8
# profit = P75 (resale price) - ad price - extra cost
hunter.deal.min-profit-toman=2000000
hunter.deal.extra-cost-toman=500000
# false = do not spam Telegram with old ads on the very first run
hunter.deal.notify-on-bootstrap=false

# ---------- Divar ----------
hunter.divar.base-url=https://api.divar.ir
# newest first; if Divar answers HTTP 400, make this empty
hunter.divar.sort=sort_date
# Divar usually needs an Iranian IP: leave proxy empty (direct connection)
hunter.divar.proxy-host=
hunter.divar.proxy-port=0

# ---------- Telegram ----------
hunter.telegram.enabled=false
hunter.telegram.bot-token=
hunter.telegram.chat-id=
# Telegram is filtered in Iran: point this to your VPN client's local HTTP proxy
# (v2rayN default: 127.0.0.1 / 10809)
hunter.telegram.proxy-host=
hunter.telegram.proxy-port=0

# ---------- LLM reviewer (optional) ----------
# none | anthropic | openai   (openai = any OpenAI-compatible server, e.g. Ollama)
hunter.llm.provider=none
hunter.llm.api-key=
hunter.llm.model=claude-haiku-5-5
# anthropic: leave empty | ollama: http://localhost:11434/v1
hunter.llm.base-url=
hunter.llm.proxy-host=
hunter.llm.proxy-port=0

# ---------- Storage (SQLite file in ./data) ----------
spring.datasource.url=jdbc:sqlite:data/hunter.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

logging.level.ir.phonehunter=INFO
